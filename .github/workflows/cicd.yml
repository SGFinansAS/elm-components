name: CICD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  merge_group:
    types: [checks_requested]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Elm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elm
          key: ${{ runner.os }}-elm-${{ hashFiles('**/elm.json') }}
          restore-keys: ${{ runner.os }}-elm-

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.0.1
          cache: npm

      # component library
      - name: Install dependencies
        run: npm ci
      - name: Validate Elm code formatting
        run: npx elm-format src/ --validate
      - name: Elm review
        run: npm run verify-lint

      # Explorer project
      - name: Install dependencies (explorer)
        run: cd explorer && npm ci
      - name: Validate Elm code formatting (explorer)
        run: cd explorer && npx elm-format src/ --validate
      - name: Elm review (explorer)
        run: cd explorer && npm run verify-lint
      - name: Build (explorer)
        run: cd explorer && npx parcel build --public-url /elm-components

      - name: Upload explorer project artifacts
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./explorer/dist"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
